<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Apple Notes Plugin: search, read and write your notes from any AI assistant">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1d1f"/>
      <stop offset="1" stop-color="#2f2a1c"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <!-- note card -->
  <g transform="translate(96 64)">
    <rect width="168" height="192" rx="18" fill="#fffdf5"/>
    <rect width="168" height="44" rx="18" fill="#ffd60a"/>
    <rect y="26" width="168" height="18" fill="#ffd60a"/>
    <rect x="24" y="68" width="104" height="10" rx="5" fill="#c9c3b0"/>
    <rect x="24" y="96" width="120" height="10" rx="5" fill="#ddd8c8"/>
    <rect x="24" y="120" width="88" height="10" rx="5" fill="#ddd8c8"/>
    <rect x="24" y="144" width="112" height="10" rx="5" fill="#ddd8c8"/>
    <circle cx="140" cy="168" r="22" fill="#1d1d1f"/>
    <circle cx="137" cy="165" r="8" fill="none" stroke="#ffd60a" stroke-width="4"/>
    <line x1="143" y1="171" x2="150" y2="178" stroke="#ffd60a" stroke-width="4" stroke-linecap="round"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="328" y="138" font-size="64" font-weight="700" fill="#ffffff">Apple Notes Plugin</text>
    <text x="330" y="188" font-size="28" fill="#c7c7cc">Search, read and write your notes from any AI assistant.</text>
    <g font-size="20" font-weight="600" fill="#1d1d1f">
      <rect x="330" y="216" width="146" height="40" rx="20" fill="#ffd60a"/>
      <text x="403" y="243" text-anchor="middle">Claude Code</text>
      <rect x="488" y="216" width="100" height="40" rx="20" fill="#ffd60a"/>
      <text x="538" y="243" text-anchor="middle">Cursor</text>
      <rect x="600" y="216" width="96" height="40" rx="20" fill="#ffd60a"/>
      <text x="648" y="243" text-anchor="middle">Codex</text>
      <rect x="708" y="216" width="188" height="40" rx="20" fill="none" stroke="#ffd60a" stroke-width="2"/>
      <text x="802" y="243" text-anchor="middle" fill="#ffd60a">any MCP client</text>
    </g>
  </g>
</svg>
